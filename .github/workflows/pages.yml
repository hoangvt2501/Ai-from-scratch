name: pages

# Build site/ and publish it to GitHub Pages.
# Manual runs are allowed so you can redeploy without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: build site data (data.js, sitemap.xml, llms.txt, build-meta.js)
        env:
          # Makes the fork's site link to and fetch lesson docs from THIS repo.
          AIFS_REPO: ${{ github.repository }}
          AIFS_SITE_ORIGIN: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node site/build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
